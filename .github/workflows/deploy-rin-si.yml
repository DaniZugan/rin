name: Deploy to rin.si

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      RIN_HOST: ${{ secrets.RIN_HOST }}
      RIN_USER: ${{ secrets.RIN_USER }}
      RIN_PORT: ${{ secrets.RIN_PORT || '22' }}
      RIN_DEPLOY_PATH: ${{ secrets.RIN_DEPLOY_PATH || '/var/www/rin.si' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.RIN_SSH_KEY }}" > ~/.ssh/rin_si_deploy_key
          chmod 600 ~/.ssh/rin_si_deploy_key
          ssh-keyscan -p "$RIN_PORT" "$RIN_HOST" >> ~/.ssh/known_hosts

      - name: Upload site files
        run: |
          rsync -az \
            --chmod=D755,F644 \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".DS_Store" \
            -e "ssh -i ~/.ssh/rin_si_deploy_key -p $RIN_PORT" \
            ./ "$RIN_USER@$RIN_HOST:$RIN_DEPLOY_PATH/"
